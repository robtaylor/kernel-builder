name: "Build and test kernel (macOS)"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened] # trigger on PRs
  workflow_dispatch:

jobs:
  build:
    name: Build kernel
    runs-on: macos-26
    steps:
      - name: "Select Xcode"
        run: sudo xcrun xcode-select -s /Applications/Xcode_26.0.app
      - name: "Install Metal Toolchain"
        run: xcodebuild -downloadComponent metalToolchain
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: huggingface
          #authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # Build Metal kernels
      - name: Build relu kernel
        run: ( cd examples/relu && nix build .\#redistributable.torch29-metal-aarch64-darwin -L )

      - name: Build relu metal cpp kernel
        run: ( cd examples/relu-metal-cpp && nix build .\#redistributable.torch29-metal-aarch64-darwin -L )

  # Test Metal kernels on self-hosted runner with GPU access.
  # Requires a self-hosted runner with Apple Silicon GPU and labels:
  #   [self-hosted, metal, macos, arm64]
  # For production CI, HF should consider macos-26-large or macos-26-xlarge
  # GitHub-hosted runners which include GPU access.
  test-metal:
    name: Test Metal kernels
    runs-on: [self-hosted, metal, macos, arm64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'metal'))
    steps:
      - name: "Select Xcode"
        run: sudo xcrun xcode-select -s /Applications/Xcode_26.0.app || true
      - name: "Install Metal Toolchain"
        run: xcodebuild -downloadComponent metalToolchain || true
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: huggingface
      - name: Build relu-metal-cpp kernel
        run: |
          cd examples/relu-metal-cpp
          nix build .\#redistributable.torch29-metal-aarch64-darwin -L
      - name: Verify MPS availability
        run: |
          nix develop .\#default -c python3 -c "
          import torch
          assert torch.backends.mps.is_available(), 'MPS not available'
          t = torch.tensor([1.0, 2.0], device='mps')
          print('MPS OK: tensor on device', t.device)
          "